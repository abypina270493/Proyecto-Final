<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta en Backoffice">
  <title>Registro | Backoffice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth">
    <section class="card">
      <h1 class="brand">Backoffice</h1>
      <p class="subtitle">Crea tu cuenta</p>

      <form id="auth-form" data-mode="register">
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="name" minlength="3" maxlength="255" required>
        </div>

        <div class="form-group">
          <label for="itsonId">ID ITSON (6 dígitos)</label>
          <input type="text" id="itsonId" name="itsonId" placeholder="123456" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña (6 a 20 caracteres)</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" maxlength="20" required>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>
        <button type="submit" class="btn">Registrarme</button>
      </form>

      <p class="switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
