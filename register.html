<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta en Backoffice">
  <title>Registro | Backoffice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth">
    <section class="card">
      <h1 class="brand">Backoffice</h1>
      <p class="subtitle">Crea tu cuenta</p>

      <form action="login.html" method="get">
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit" class="btn">Registrarme</button>
      </form>

      <p class="switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
</body>
</html>
