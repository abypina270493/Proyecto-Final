<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en Backoffice">
  <title>Iniciar sesión | Backoffice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth">
    <section class="card">
      <h1 class="brand">Backoffice</h1>
      <p class="subtitle">Inicia sesión para continuar</p>

      <form action="home.html" method="get">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>

      <p class="switch">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
    </section>
  </main>
</body>
</html>
